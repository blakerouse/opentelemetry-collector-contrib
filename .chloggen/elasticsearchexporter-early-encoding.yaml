# Use this changelog template to create an entry for release notes.

# One of 'breaking', 'deprecation', 'new_component', 'enhancement', 'bug_fix'
change_type: enhancement

# The name of the component, or a single word describing the area of concern, (e.g. receiver/filelog)
component: exporter/elasticsearch

# A brief description of the change.  Surround your text with quotes ("") if it needs to start with a backtick (`).
note: Encode records (logs, metrics, traces and profiles) to Elasticsearch bulk items at ingest time instead of on the sending-queue consumer, and add the `exporter.elasticsearch.earlyEncodingWithPersistentQueue` feature gate to extend this to the persistent sending queue.

# Mandatory: One or more tracking issues related to the change. You can use the PR number here if no issue exists.
issues: [49835]

# (Optional) One or more lines of additional information to render under the primary note.
# These lines will be padded with 2 spaces and then inserted directly into the document.
# Use pipe (|) for multiline entries.
subtext: |
  Early encoding moves per-record JSON serialization off the sending-queue consumer's critical path,
  improving throughput and making the byte sizer O(1). It is always used with the in-memory queue. With a
  persistent queue (sending_queue.storage) it is opt-in behind the feature gate, since it changes the
  on-disk queue format. On drain the exporter reads both early-encoded and legacy pdata payloads, so the
  gate can be enabled on upgrade without draining the queue; only downgrades require draining first.

